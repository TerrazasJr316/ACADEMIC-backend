version: "3.8"

services:
  # --- SERVICIO 1: BASE DE DATOS (Ya lo tenías) ---
  db:
    image: postgres:15-alpine
    container_name: academic_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
      POSTGRES_DB: ${DB_NAME:-academic_saas}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- SERVICIO 2: PGADMIN (Ya lo tenías) ---
  pgadmin:
    image: dpage/pgadmin4
    container_name: academic_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
    depends_on:
      - db

  # --- SERVICIO 3: SONARQUBE (NUEVO - Calidad de Código) ---
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube_server
    ports:
      - "9000:9000"
    environment:
      # Desactiva chequeos estrictos de sistema (útil para desarrollo rápido)
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      # Persistencia de datos (para no perder el historial al reiniciar)
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs

volumes:
  postgres_data:
  # Nuevos volúmenes para SonarQube
  sonar_data:
  sonar_extensions:
  sonar_logs:
