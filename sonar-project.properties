# Identificador único (debe coincidir con el que creaste en la web)
sonar.projectKey=Acamdey-test
sonar.projectName=Academy Test Backend
# Versión del proyecto
sonar.projectVersion=1.0

# Qué carpetas escanear (el código fuente)
sonar.sources=src

# Ruta al reporte de cobertura LCOV
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Aseguramos que Sonar incluya los archivos de test en el análisis general (opcional, pero bueno)
sonar.test.inclusions=**/*.int-spec.ts
sonar.coverage.inclusions=src/auth/auth.service.ts

# Qué carpetas ignorar (test, node_modules, dist)
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,**/*.test.ts

# Idioma (opcional, pero ayuda)
sonar.language=ts
sonar.sourceEncoding=UTF-8